<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Crear cuenta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/elegir.css">

</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-10">

                <h1 class="text-center mt-5 mb-5">
                    Crear una cuenta
                </h1>

                <div class="row">

                    <!-- Comprador -->

                    <div class="col-md-6">

                        <div class="card shadow p-4 text-center h-100">

                            <i class="bi bi-cart-fill display-1 text-warning"></i>

                            <h3 class="mt-3">
                                Comprador
                            </h3>

                            <p>

                                Compra productos.

                                Guarda favoritos.

                                Realiza pedidos.

                            </p>

                            <a href="registro_comprador.html" class="btn btn-warning">

                                Crear cuenta

                            </a>

                        </div>

                    </div>

                    <!-- Vendedor -->

                    <div class="col-md-6">

                        <div class="card shadow p-4 text-center h-100">

                            <i class="bi bi-shop display-1 text-warning"></i>

                            <h3 class="mt-3">
                                Vendedor
                            </h3>

                            <p>

                                Publica productos.

                                Gestiona ventas.

                                Vende a miles de personas.

                            </p>

                            <a href="registro_vendedor.html" class="btn btn-warning">

                                Crear cuenta

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
