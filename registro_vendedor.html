<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Registro de Vendedor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/registro_vendedor.css">

</head>

<body class="bg-light">

    <nav class="navbar bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold fs-3" href="index.html">

                COMPRA<span class="text-warning">VENTA</span>

            </a>

        </div>

    </nav>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow border-0 rounded-4">

                    <div class="card-body p-5">

                        <h2 class="text-center mb-4">

                            Registro de vendedor

                        </h2>

                        <form>

                            <h5 class="text-warning mb-3">

                                Datos personales

                            </h5>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label>Nombre completo</label>

                                    <input type="text" class="form-control">

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>Documento</label>

                                    <input type="text" class="form-control">

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>Correo</label>

                                    <input type="email" class="form-control">

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>Celular</label>

                                    <input type="text" class="form-control">

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>Contraseña</label>

                                    <input type="password" class="form-control">

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>Confirmar contraseña</label>

                                    <input type="password" class="form-control">

                                </div>

                            </div>

                            <hr>

                            <h5 class="text-warning mb-3">

                                Dirección

                            </h5>

                            <div class="row">

                                <div class="col-md-4 mb-3">

                                    <label>País</label>

                                    <input type="text" class="form-control">

                                </div>

                                <div class="col-md-4 mb-3">

                                    <label>Departamento</label>

                                    <input type="text" class="form-control">

                                </div>

                                <div class="col-md-4 mb-3">

                                    <label>Ciudad</label>

                                    <input type="text" class="form-control">

                                </div>

                                <div class="col-12 mb-3">

                                    <label>Dirección</label>

                                    <input type="text" class="form-control">

                                </div>

                            </div>

                            <hr>

                            <h5 class="text-warning mb-3">

                                Información de la tienda

                            </h5>

                            <div class="mb-3">

                                <label>Nombre de la tienda</label>

                                <input type="text" class="form-control">

                            </div>

                            <div class="mb-3">

                                <label>Categoría</label>

                                <select class="form-select">

                                    <option>Tecnología</option>

                                    <option>Hogar</option>

                                    <option>Moda</option>

                                    <option>Accesorios</option>

                                    <option>Otros</option>

                                </select>

                            </div>

                            <div class="mb-3">

                                <label>Descripción</label>

                                <textarea class="form-control" rows="4"></textarea>

                            </div>

                            <hr>

                            <h5 class="text-warning mb-3">

                                Verificación

                            </h5>

                            <div class="mb-3">

                                <label>Foto del documento</label>

                                <input type="file" class="form-control">

                            </div>

                            <div class="mb-3">

                                <label>Foto del reverso</label>

                                <input type="file" class="form-control">

                            </div>

                            <div class="form-check mb-4">

                                <input class="form-check-input" type="checkbox">

                                <label class="form-check-label">

                                    Acepto los términos y condiciones.

                                </label>

                            </div>

                            <button class="btn btn-warning w-100">

                                Crear cuenta de vendedor

                            </button>

                        </form>

                        <div class="text-center mt-4">

                            ¿Ya tienes una cuenta?

                            <a href="login.html" class="text-warning fw-bold">

                                Inicia sesión

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
